maintenance = false
key = ""
database {
    uri = "mongodb://localhost:27017"
    name = "Test Database"
}

server {
    motd {
        maintenance {
            online-players = 0
            maximum-players = 50
            protocol-version = -1
            protocol-name = "Maintenance"
        }
        released {
            maximum-players = 50
            protocol-name = "Requires MC 1.8 / 1.20.3"
        }
    }

    punishment-messages {
        permanently-banned = [
            "<red>You are permanently banned from this server!</red>"
            ""
            "<gray>Reason: <white>%punishmentReason%</white>"
            "<gray>Find out more: <aqua><underlined>%punishmentUrl%</underlined></aqua>"
            ""
            "<gray>Ban ID: <white>#%punishmentId%</white>"
            "<gray>Sharing your Ban ID may affect the processing of your appeal!"
        ]
        temporarily-banned = [
            "<red>You are temporarily banned for <white>%remainingPunishmentTime%</white> <red>from this server!</red>"
            ""
            "<gray>Reason: <white>%punishmentReason%</white>"
            "<gray>Find out more: <aqua><underlined>%punishmentUrl%</underlined></aqua>"
            ""
            "<gray>Ban ID: <white>#%punishmentId%</white>"
            "<gray>Sharing your Ban ID may affect the processing of your appeal!"
        ]
        temporarily-muted = [
            "<red><bold><strikethrough>---------------------------------------------</strikethrough></bold></red>"
            "<red>You are currently muted for: %punishmentReason%</red>"
            "<gray>Your mute will expire in <red>%remainingPunishmentTime%</red></gray>"
            "<gray>Find out more here: <yellow>%punishmentUrl%</yellow></gray>"
            "<gray>Mute ID: <white>#%punishmentId%</white></gray>"
            "<red><bold><strikethrough>---------------------------------------------</strikethrough></bold></red>"
        ]
        permanently-muted = [
            "<red><bold><strikethrough>---------------------------------------------</strikethrough></bold></red>"
            "<red>You are permanently muted for: %punishmentReason%</red>"
            "<gray>Find out more here: <yellow>%punishmentUrl%</yellow></gray>"
            "<gray>Mute ID: <white>#%punishmentId%</white></gray>"
            "<red><bold><strikethrough>---------------------------------------------</strikethrough></bold></red>"
        ]
    }
}

